# Provenance of configs/splits/coralnet.csv.
dataset: coralnet
file: coralnet.csv
columns:
  group: per-source group label, "s<source_id>"
  source_id: CoralNet source id
  split_group: connected-component id from the original split build (int); blank on excluded rows, and blank means none
  split: train | val | test | excluded

derived_from:
  # The per-split source sets equal data.coralnet.{train,val,test}.whitelist_sources
  # in configs/data_config.yaml at this main commit (585 / 102 / 139 sources).
  whitelists:
    file: configs/data_config.yaml
    commit: dd2b48f05ed0b67fa84fe919e842971e74a604c8
  # split_group comes from the group column of this file on branch cleaned_up_rerun.
  split_group:
    file: configs/coralnet/source_splits.csv
    commit: e0d387684ac86e13262e917d9d82aab5e22f0c9d

builder:
  # Last commit that generated source_splits.csv before it was edited by hand.
  module: mermaidseg/datasets/coralnet/dedup/splits.py
  commit: bc0085b07009e1c6c6bb39f5e316e8dbf89108dc
  # These are the argparse defaults at that commit (path arguments omitted).
  # The actual invocation was not recorded.
  parameters:
    val_frac: 0.10
    test_frac: 0.10
    max_group_frac: 0.25
    max_id_gap: 3
    max_km: 50.0
    min_class_points: 500
    min_eval_points: 100
    w_coverage: 1.0
    w_size: 10.0
    iters: 200000
    restarts: 8
    seed: 0

# Set once the leakage check has run against a published coralnet dataset version.
checked_against: null

overrides:
  # Hand edits made after the builder ran: sources moved into train.
  # Fill in each reason.
  commit: e0d387684ac86e13262e917d9d82aab5e22f0c9d
  sources:
    - {source_id: 800, group: s800, split_group: 95, from: test, to: train, reason: ""}
    - {source_id: 1588, group: s1588, split_group: 107, from: test, to: train, reason: ""}
    - {source_id: 3765, group: s3765, split_group: 195, from: test, to: train, reason: ""}
