model:
  name: "ConceptBottleneckDPTLoRADINOv3"
  encoder_name: "facebook/dinov3-vits16-pretrain-lvd1689m"
  # 256x256 ViT-S config for the ViT-size sweep. Training crops are 256.
  # 512 eval uses model_config_cbm_dpt_lora_vits.yaml. The DPT head infers the
  # token grid, and out_indices stays null so the four blocks follow this depth.
  input_size: [256, 256]
  concept_feature_dim: 256
  out_indices: null
  neck_hidden_sizes: [256, 512, 1024, 1024]
  fusion_hidden_size: 256
  reassemble_factors: [4, 2, 1, 0.5]
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  lora_bias: "none"
