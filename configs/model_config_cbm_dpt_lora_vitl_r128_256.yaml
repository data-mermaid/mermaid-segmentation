model:
  name: "ConceptBottleneckDPTLoRADINOv3"
  encoder_name: "facebook/dinov3-vitl16-pretrain-lvd1689m"
  # 256x256 rank-128 config. Training and cooldown use this file (data crops are
  # 256). 256 eval uses it too. 512 eval uses model_config_cbm_dpt_lora_vitl_r128.yaml.
  # The DPT head infers the token grid dynamically, so a 256-trained model also
  # evaluates at 512.
  input_size: [256, 256]
  # Concept bottleneck: DPT features -> concepts -> classes.
  concept_feature_dim: 256
  # DPT head: intermediate blocks reassembled into a multi-scale pyramid.
  # out_indices defaults to 4 evenly spaced blocks (null = auto).
  out_indices: null
  neck_hidden_sizes: [256, 512, 1024, 1024]
  fusion_hidden_size: 256
  reassemble_factors: [4, 2, 1, 0.5]
  # LoRA adapters on the frozen DINOv3 attention projections.
  # Rank 128 / alpha 256 keeps the same scale (alpha/r = 2) as rank 16 / alpha 32.
  lora_r: 128
  lora_alpha: 256
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  lora_bias: "none"
