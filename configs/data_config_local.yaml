# Local data config: MERMAID only.
#
# Stripped-down version of data_config_coralnet_mermaid.yaml for fast local
# training runs. Excludes CoralNet (which needs the
# MERMAID_CORALNET_ANNOTATIONS_PATH env var) and all other datasets.
# Requires AWS credentials for S3 access (AWS_PROFILE=mermaid-core).
data:
  default:
    train:
      transform:
        SmallestMaxSize:
          max_size: 1024
        RandomResizedCrop:
          size: [512, 512]
          scale: [0.2, 1]
          ratio: [0.75, 1.33]
        HorizontalFlip:
          p: 0.5
        VerticalFlip:
          p: 0.5
        Normalize:
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
    val:
      transform:
          Resize:
            width: 512
            height: 512
          Normalize:
            mean: [0.485, 0.456, 0.406]
            std: [0.229, 0.224, 0.225]

  mermaid:
    train:
      holdout_fraction: 0.1
      holdout_seed: 42
      holdout_role: train
    val:
      holdout_fraction: 0.1
      holdout_seed: 42
      holdout_role: val

  coralnet:
    train: None
    val: None

  coralscapes:
    train: None
    val: None

  coralscapes_v2:
    train: None
    val: None

  benthos_yuval:
    train: None
    val: None

  catlin_seaview:
    train: None
    val: None

  moorea_labeled_corals:
    train: None
    val: None

  pacific_labeled_corals:
    train: None
    val: None
