data:
  local_cache_dir: /archive/vision/beery/red_sea_coral/cache_MERMAID
  local_cache_write_through: true
  default:
    train:
      transform:
        SmallestMaxSize:
          max_size: 1024
        RandomResizedCrop:
          size: [256, 256]
          scale: [0.2, 1]
          ratio: [0.75, 1.33]
        HorizontalFlip:
          p: 0.5
        VerticalFlip:
          p: 0.5
        ColorJitter:
          brightness: 0.1
          contrast: 0.1
          saturation: 0.1
          hue: 0.03
        Normalize:
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
    val:
      transform:
          Resize:
            width: 256
            height: 256
          Normalize:
            mean: [0.485, 0.456, 0.406]
            std: [0.229, 0.224, 0.225]

  coralnet:
    train:
      whitelist_sources: [1968, 2055, 2297, 2759, 2799, 2978, 3064, 3363, 3411, 
                          3425, 3460, 4342, 4353, 4430, 4451, 4596, 4710, 4882, 
                          4957, 5102, 5221, 6521, 6687, 6695, 6698, 6716, 6733, 
                          6839, 6855, 6919, 6920, 6921, 6922, 6923, 6924, 6927, 
                          6928, 6929, 6930, 6931, 6932, 7116]

    val:
      whitelist_sources: [1645, 1776, 1783, 3058, 3466, 3573, 4614, 4721, 5155, 5181, 
                          5444, 5847, 6537, 6699, 6700, 6721, 6834, 6838, 6918, 6926, 6968]

    

  mermaid:
    val: None # We currently have no validation data for the mermaid dataset, so we set this to None to avoid speculation.

  coralscapes:
    train: None
    val: None

  coralscapes_v2:
    train:
      split: [train, validation]
      transform:
        RandomResizedCrop:
          size: [256, 256]
          scale: [0.2, 1]
          ratio: [0.75, 1.33]
        HorizontalFlip:
          p: 0.5
        VerticalFlip:
          p: 0.5
        ColorJitter:
          brightness: 0.1
          contrast: 0.1
          saturation: 0.1
          hue: 0.03
        Normalize:
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]
    val:
      split: test
      transform:
        Resize:
          width: 256
          height: 256
        Normalize:
          mean: [0.485, 0.456, 0.406]
          std: [0.229, 0.224, 0.225]

  benthos_yuval:
    train: None
    val:
      whitelist_sites: ["RS24", "CR_DoubleWreck"]

  catlin_seaview:
    train:
      whitelist_regions: ["ATL", "IND_CHA", "IND_MDV", "PAC_AUS", "PAC_IDN_PHL", "PAC_SLB" ,"PAC_TLS" ,"PAC_TWN" ,"PAC_USA"]
    val: None

  moorea_labeled_corals:
    train:
      whitelist_years: ["2008","2009","2010"]
    val: None

  pacific_labeled_corals:
    train: None
    val:
      whitelist_subsets: ["reference", "evaluation"]
  ucsd_mosaics:
    train:
      whitelist_sites: ["fr3", "fr5", "fr7", "fr9", "pal132", "pal239", "pal36", "pal69", "palstrawn", "palwave13", "palwave14", "palwave37", "palwave38", "palwave39", "palwave4", "palwave40"]
    val: None