# Final-run mixture: pinned dataset versions in mermaid-ic-datasets.
# CoralNet trains on its train and val splits; test splits stay held out.
data:
  taxonomy:
    version: 20261124-e6abfad
    manifest_sha256: fc12b99c119b0151e6fb02ea7bb9870f423bd220764d5f47b57d2305fc3f6b43
  default:
    train:
      transform:
        SmallestMaxSize:
          max_size: 1024
        RandomResizedCrop:
          size: [256, 256]
          scale: [0.2, 1]
          ratio: [0.75, 1.33]
        HorizontalFlip:
          p: 0.5
        VerticalFlip:
          p: 0.5
        ColorJitter:
          brightness: 0.1
          contrast: 0.1
          saturation: 0.1
          hue: 0.03
  datasets:
    coralnet:
      version: 20261124-cfc389d
      manifest_sha256: a9de45e16219340929e1fdfb908759cd560407bcff7fb636b8ddd812b269e8a4
      split_file: configs/splits/coralnet.csv
      resize: {max_edge: 2048, filter: lanczos, jpeg_quality: 95}
      train: {use: [train, val]}
      test: {use: [test]}
    mermaid:
      version: 20261124-cfc389d
      manifest_sha256: f7a1495475bcf0feeedfe91230e376233a41a00d22c57209eac8142865b049a8
      train: {groups: all}
    coralscapes_v2:
      version: 20261124-cfc389d
      manifest_sha256: ec8c584a21bb71bff0d4894dfb62a9d273f2abf9ce24b9666a59617b4a9d208d
      train:
        groups: [train, validation]
        repeat: 6
        transform:
          RandomResizedCrop:
            size: [256, 256]
            scale: [0.2, 1]
            ratio: [0.75, 1.33]
          HorizontalFlip:
            p: 0.5
          VerticalFlip:
            p: 0.5
          ColorJitter:
            brightness: 0.1
            contrast: 0.1
            saturation: 0.1
            hue: 0.03
      test: {groups: [test]}
    benthos_yuval:
      version: 20261124-cfc389d
