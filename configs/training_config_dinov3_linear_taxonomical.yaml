# LinearDINOv3 + TaxonomicalLoss (hierarchy-aware class loss). Pair with model_config for LinearDINOv3.
# Same class_subset / roll-up as the issue #12 CE baseline; swap loss only.
training:
    training_mode: "standard"
    freeze_encoder: true
    loss:
        type: TaxonomicalLoss
        ignore_index: 0
        damping_denominator: 100
        alpha: 0.1
        beta: 0.1
        level_names: null
    epochs: 200
    optimizer:
        type: AdamW
        lr: 0.001
        weight_decay: 0.01
    scheduler:
        type: PolynomialLR
        power: 1
        total_iters: 200
        # Frozen probe: no LR warmup (only the head trains on fixed features). Without this,
        # meta.py defaults warmup_iters to 2000 (~2 epochs) — a fine-tune-oriented default.
        warmup_iters: 0
    iterations_per_train_epoch: 1000
    iterations_per_val_epoch: 200
    # Bumped 8 -> 32: the issue-12 baseline run (MLflow f1cf7811) used only 2.85 GB of the 24 GB
    # GPU at batch 8, so there is large headroom (32 ~= 11 GB est.). NOTE: lr (1e-3) may want
    # scaling for the larger batch (~sqrt rule -> ~2e-3) — leave as an explicit experiment choice.
    # The frozen LinearDINOv3 encoder now runs under torch.no_grad (frees activation memory), so 64
    # is worth trying once verified on the target GPU.
    batch_size: 32
    # Target-class whitelist (SourceLabelRegistry target_label_subset). Ids 1..N are assigned
    # alphabetically; id 0 is the unmapped/ignore slot (ignore_index: 0). Names must match the
    # produced targets (CoralNet->MERMAID map values + MERMAID benthic-attribute hierarchy)
    # exactly and case-sensitively. Carried over from configs/training_config.yaml — confirm this
    # matches Emily's finalized label set before the real run.
    class_subset: ['Acanthastrea', 'Acropora', 'Agaricia agaricites', 'Algae covered substrate', 'Alveopora',
                    'Astrea', 'Astreopora', 'Background', 'Bare substrate', 'Coscinaraea', 'Crustose coralline algae',
                    'Cyanobacteria', 'Cyphastrea', 'Dark', 'Dictyota', 'Diploastrea', 'Dipsastraea', 'Echinophyllia',
                    'Echinopora', 'Euphyllia', 'Favia', 'Favites', 'Fungia', 'Galaxea', 'Gardineroseris', 'Goniastrea',
                    'Goniopora', 'Gorgonian', 'Halimeda', 'Hard coral', 'Heliopora', 'Human', 'Human-made structure', 'Hydnophora',
                    'Isopora', 'Leptastrea', 'Leptoria', 'Leptoseris', 'Lobophora', 'Lobophyllia', 'Macroalgae', 'Madracis',
                    'Merulina', 'Millepora', 'Montastraea', 'Montastraea cavernosa', 'Montipora', 'Mycedium',
                    'Orbicella annularis', 'Orbicella faveolata', 'Pachyseris', 'Padina', 'Pavona', 'Pectinia', 'Platygyra',
                    'Pocillopora', 'Porites', 'Porites astreoides', 'Psammocora', 'Rock', 'Rubble', 'Sand', 'Sargassum',
                    'Sea urchin', 'Seagrass', 'Seriatopora', 'Siderastrea siderea', 'Soft coral', 'Sponge', 'Stylophora',
                    'Symphyllia', 'Transect tools', 'Tridacna giant clam', 'Turbinaria-algae', 'Turbinaria-coral',
                    'Turf algae', 'Zoanthid']
    padding: 3
    label_roll_up: True
