# 50k-update fine-tune of the 700k cooled model (256 px) with ONE added taxonomy loss term.
# Copy of training_config_cbm_hires.yaml, the config of the baseline fine-tune with the default
# loss (Jonathan's run cbm_hires_res256_mb32, its 256 px case). Everything else is identical,
# except microbatch 16 x 2 accumulation in place of batch 32 (same effective batch).
training:
    training_mode: "concept-bottleneck"
    freeze_encoder: true
    detach_concepts: true
    concept_mapping_path: "../configs/class_to_concepts.csv"
    loss:
        type: ConceptBottleneckLoss
        lambda_weight: 1
        ignore_index: 0
        # Compromise from the pixel-vs-image loss-weight sweep.
        per_pixel_loss_weight: 0.5
        per_image_loss_weight: 0.5
    # Marginal partial-label CE (mermaidseg/model/taxonomy_loss.py): for every pixel labelled at rank d,
    # the rank d+1 head's mass must lie inside that label's children. Applied to every adjacent pair
    # (not only the pixel's deepest labelled rank), divided by the 6 ranks like the per-rank CE.
    # On the 700k model the 5-pair sum is ~1.8, so weight 1.0 adds ~0.30, about the size of the
    # whole concept CE (~0.39). Reduction follows loss: (0.5 / 0.5).
    taxonomic_loss:
        ambiguity_policy: permissive
        partial_weight: 1.0
        partial_uniform_anneal_iters: 0
        kl_weight: 0.0
    max_grad_norm: 0.5
    # One epoch of 50_000 optimizer updates. The first 4000 are linear warmup;
    # LinearLR then decays to 0 over the remaining 46_000 updates (stepped per
    # update, so a single epoch actually decays). model_step{N} is written every
    # 10_000 updates and is not uploaded to wandb. The sbatch overrides
    # batch_size / grad_accum_steps per resolution so the effective batch stays 32.
    epochs: 1
    optimizer:
        type: AdamW
        lr: 0.00005          # fallback / default; also the DPT + concept/class head LR
        weight_decay: 0.01
        lora_lr: 0.00001     # backbone LoRA adapter params
        dpt_lr: 0.00005      # DPT head + concept_proj + concept_classifier
    scheduler:
        type: LinearLR
        start_factor: 1.0
        end_factor: 0.0
        total_iters: 46000   # optimizer steps after warmup; step_every is iteration
        step_every: iteration
        warmup_iters: 4000   # in optimizer updates; keep <= iterations_per_train_epoch
        warmup_start_factor: 0.01
    mixed_precision: true
    mixed_precision_dtype: bfloat16
    iterations_per_train_epoch: 50000
    iterations_per_val_epoch: 400
    # Microbatch 16 x 2 accumulation = the baseline's effective batch 32 (same images per update);
    # batch 32 does not fit an A100 80GB with the extra per-pixel loss terms.
    batch_size: 16
    grad_accum_steps: 2
    checkpoint_every_steps: 10000
    class_subset: ['Acanthastrea', 'Acropora', 'Agaricia agaricites', 'Algae covered substrate', 'Alveopora',
                    'Astrea', 'Astreopora', 'Background', 'Bare substrate', 'Coscinaraea', 'Crustose coralline algae',
                    'Cyanobacteria', 'Cyphastrea', 'Dark', 'Dictyota', 'Diploastrea', 'Dipsastraea', 'Echinophyllia',
                    'Echinopora', 'Euphyllia', 'Favia', 'Favites', 'Fish', 'Fungia', 'Galaxea', 'Gardineroseris', 'Goniastrea',
                    'Goniopora', 'Gorgonian', 'Halimeda', 'Hard coral', 'Heliopora', 'Human', 'Human-made structure', 'Hydnophora',
                    'Isopora', 'Leptastrea', 'Leptoria', 'Leptoseris', 'Lobophora', 'Lobophyllia', 'Macroalgae', 'Madracis',
                    'Merulina', 'Millepora', 'Montastraea', 'Montastraea cavernosa', 'Montipora', 'Mycedium',
                    'Orbicella annularis', 'Orbicella faveolata', 'Pachyseris', 'Padina', 'Pavona', 'Pectinia', 'Platygyra',
                    'Pocillopora', 'Porites', 'Porites astreoides', 'Psammocora', 'Rock', 'Rubble', 'Sand', 'Sargassum',
                    'Sea urchin', 'Seagrass', 'Seriatopora', 'Siderastrea siderea', 'Soft coral', 'Sponge', 'Stylophora',
                    'Symphyllia', 'Transect tools', 'Tridacna giant clam', 'Turbinaria-algae', 'Turbinaria-coral',
                    'Turf algae', 'Zoanthid']
    padding: 3
    label_roll_up: True
