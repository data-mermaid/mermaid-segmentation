[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coralnet-scraper"
version = "0.1.0"
description = "Downloads public CoralNet sources (images, labelsets, annotations) to S3."
requires-python = ">=3.11.5"
dependencies = [
    "beautifulsoup4",
    "boto3",
    "pandas",
    "pillow>=12.2",
    "requests",
    "requests-ratelimiter",
    "stamina>=26.2",
    "tqdm",
]

[project.scripts]
coralnet-scrape = "coralnet_scraper.scrape_coralnet_s3:main"

[dependency-groups]
tests = [
    "pytest>=8.0",
    "pytest-socket>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--allow-hosts=127.0.0.1,::1"]
