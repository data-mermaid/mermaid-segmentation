[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coralnet-dataset"
version = "0.1.0"
description = "Builds the CoralNet annotation, image and training-manifest parquets from the scraped S3 sources."
requires-python = ">=3.11.5"
dependencies = [
    "coralnet-scraper",
    "boto3",
    "ibis-framework[duckdb]",
    "pandas",
    "pillow",
    "pyarrow",
    "tqdm",
]

[project.scripts]
coralnet-dataset = "coralnet_dataset.cli:main"

[dependency-groups]
tests = [
    "pytest>=8.0",
    "pytest-socket>=0.7",
]

[tool.uv.sources]
coralnet-scraper = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--allow-hosts=127.0.0.1,::1"]
