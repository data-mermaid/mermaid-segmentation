[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coralnet-dataset"
version = "0.1.0"
description = "Builds the CoralNet annotation, image and training-manifest parquets from the scraped S3 sources."
requires-python = ">=3.11"
dependencies = [
    "coralnet-scraper",
    "boto3>=1.43.3",
    "ibis-framework[duckdb]>=12.0.0",
    "pandas>=2.3.3",
    "pillow>=12.2.0",
    "pyarrow>=23.0.1",
    "tqdm>=4.67.3",
]

[project.scripts]
coralnet-dataset = "coralnet_dataset.cli:main"

[dependency-groups]
tests = [
    "pytest>=8.0",
]

[tool.uv.sources]
coralnet-scraper = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
