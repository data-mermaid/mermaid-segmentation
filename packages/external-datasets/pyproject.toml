[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "external-datasets"
version = "0.1.0"
description = "Validates external segmentation datasets and publishes them to S3 with a manifest."
requires-python = ">=3.11.5"
dependencies = [
    "boto3",
    "numpy",
    "pandas",
    "pillow",
    "pyarrow",
    "requests",
    "tqdm",
]

[project.scripts]
external-datasets = "external_datasets.cli:main"

[dependency-groups]
tests = [
    "pytest>=8.0",
    "pytest-socket>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--allow-hosts=127.0.0.1,::1"]
