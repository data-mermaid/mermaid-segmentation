name: Lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - "**/*.ipynb"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - "**/*.ipynb"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      - name: Detect changed files
        id: changed-files
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c  # v46.0.5
        with:
          separator: "\n"
          # Off so paths arrive unescaped; they reach `run` only through env vars.
          safe_output: false
          files: |
            **/*.py
            **/*.pyi
            **/*.ipynb
      - name: Check lockfile is up to date
        run: uv lock --check
      - name: Ruff check (changed files only)
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: printf '%s\n' "$FILES" | xargs -d '\n' uv run --group lint ruff check
      - name: Ruff format check (changed files only)
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: printf '%s\n' "$FILES" | xargs -d '\n' uv run --group lint ruff format --check
