name: Lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - "**/*.ipynb"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - "**/*.ipynb"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Detect changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files: |
            **/*.py
            **/*.pyi
            **/*.ipynb
      - name: Check lockfile is up to date
        run: uv lock --check
      - name: Ruff check (changed files only)
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          # Unquoted on purpose: word-splitting turns the space-separated list into argv.
          # shellcheck disable=SC2086
          uv run --group lint ruff check $CHANGED_FILES
      - name: Ruff format check (changed files only)
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          # shellcheck disable=SC2086
          uv run --group lint ruff format --check $CHANGED_FILES
