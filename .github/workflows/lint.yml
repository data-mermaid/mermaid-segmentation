name: Lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - "**/*.ipynb"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - "**/*.ipynb"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Detect changed Python files
        id: changed-py
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          LIST="$RUNNER_TEMP/changed-py.list"
          : > "$LIST"
          if [ -n "$PR_BASE_SHA" ]; then
            # Three-dot: only this branch's own changes, not later moves on the base branch.
            RANGE="$PR_BASE_SHA...$GITHUB_SHA"
            BASE="$PR_BASE_SHA"
          else
            RANGE="$PUSH_BEFORE_SHA..$GITHUB_SHA"
            BASE="$PUSH_BEFORE_SHA"
          fi
          # A new-branch push has an all-zero or unfetched base: there is no diff to take.
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::notice::Changed-file checks (docstring, mypy) skipped: base commit '${BASE}' is not available to diff against."
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c core.quotepath=off diff -z --name-only --diff-filter=ACMR "$RANGE" -- '*.py' > "$LIST"
          if [ -s "$LIST" ]; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check lockfile is up to date
        run: uv lock --check
      # Tool versions pinned to match .pre-commit-config.yaml.
      - name: ruff check
        uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b  # v4.0.0
        with:
          version: "0.15.12"
          args: "check"
      - name: ruff format
        uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b  # v4.0.0
        with:
          version: "0.15.12"
          args: "format --check"
      - name: Docstring check (changed files only)
        if: steps.changed-py.outputs.any_changed == 'true'
        run: xargs -0 uv run --group lint ruff check --extend-select D < "$RUNNER_TEMP/changed-py.list"
      - name: Type check (changed files only)
        if: steps.changed-py.outputs.any_changed == 'true'
        run: xargs -0 uv run --group lint mypy < "$RUNNER_TEMP/changed-py.list"
