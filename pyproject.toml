[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mermaidseg"
version = "0.1.0"
description = "A package for the segmentation of MERMAID coral data."
requires-python = ">=3.11"
dependencies = [
    "albumentations",
    "boto3",
    "numpy>=1.24,<2",
    "pandas",
    "pillow",
    "requests",
    "torch>=2.4,<2.8",
    "transformers",
    "datasets>=3.0",
    "s3fs",
    "mlflow",
    "pyyaml",
    "tqdm",
    "torchmetrics",
    "huggingface-hub>=0.36.2",
    "opencv-python-headless>=4.11.0.86",
    "peft>=0.19.1",
    "wandb>=0.25.0",
]

[dependency-groups]
tests = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
lint = [
    "ruff>=0.15.8",
    "pre-commit>=3.0",
    "mypy>=2.4.1",
]
dev = [
    {include-group = "tests"},
    {include-group = "lint"},
]

[tool.setuptools]
packages = { find = { where = ["."], include = ["mermaidseg*"] } }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RET", "SIM", "PD", "D"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["mermaidseg"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["mermaidseg", "scripts", "tests"]
ignore_missing_imports = true
follow_imports = "silent"
explicit_package_bases = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-m",
    "not live",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "live: marks tests as live integration tests requiring S3 and/or CoralNet access (deselect with '-m \"not live\"')",
    "smoke: marks fast offline smoke tests of the training pipeline wiring",
]

[tool.coverage.run]
source = ["mermaidseg"]
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
