job:
  name_prefix: mermaidseg-dinov3-lora-r8-focal
  image: mermaid-segmentation-jobs:training-latest
  entrypoint: scripts/sagemaker_train_entrypoint.py
  instance_type: ml.g6.2xlarge
  volume_gb: 200
  max_runtime_hours: 48
  env:
    MERMAID_CORALNET_ANNOTATIONS_PATH: etl-outputs/coralnet/20260623_nogit/coralnet_training_manifest_20260623_nogit.parquet

# Pure Focal loss (no inverse-frequency class weights) on LoRA q/v r8. Same LoRA model + data as
# dinov3_lora_qv_r8.yaml; only the training config swaps CE -> Focal. Motivated by the CE-linear
# vs ClassWeightedFocal-linear comparison (weighted focal collapsed); this un-stacks the loss.
config:
  config_data: configs/data_config_coralnet_mermaid.yaml
  config_model: configs/model_config_dinov3_lora_qv_r8.yaml
  config_training: configs/training_config_dinov3_lora_focal.yaml
  config_logger: configs/logger_config.yaml
  overrides:
    run-name: dinov3-lora-qv-r8-focal-coralnet-all-mermaid
    experiment-name: post-baseline
    epochs: 200
    seed: 42
    num-workers: 8
    metric-of-interest: miou
    early-stopping: true
    early-stopping-patience: 20
