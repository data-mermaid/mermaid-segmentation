# cbm_final_res768 on SageMaker; mirrors the cbm_final_res768 run of slurm/launch_final.sh.
job:
  name_prefix: mermaidseg-cbm-final-res768
  image: mermaid-segmentation-jobs:training-latest
  instance_type: ml.g6e.12xlarge
  volume_gb: 500
  max_runtime_hours: 168
train:
  run_name: cbm_final_res768
  init_weights: model_checkpoints/cbm_final/model_step300000
  args:
    - --training-config
    - configs/training_config_cbm_final_hires.yaml
    - --resolution
    - "768"
    - --data-config
    - configs/data_config_trainval.yaml
    - --batch-size
    - "8"
    - --grad-accum-steps
    - "4"
    - --logger-config
    - configs/logger_config_sagemaker.yaml
